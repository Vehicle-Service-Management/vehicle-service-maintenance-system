name: CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to test (use a full commit SHA)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

      - name: Show tested commit
        run: |
          echo "Testing commit:"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run API tests
        run: npm test

      - name: Typecheck API
        run: npm run typecheck

      - name: Typecheck client
        run: npm run typecheck:client

      - name: Lint client
        run: npm --prefix client run lint

      - name: Build client
        run: npm --prefix client run build

      - name: Build API
        run: npm run build
